name: Pages

# Сайт обновляется с каждым релизом (коммит в main) или вручную из вкладки Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # выложить сайт
  id-token: write # подтвердить Pages, что деплой идёт из этого репозитория

# Два деплоя одновременно не запускаем, но и начатый не обрываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Прогнать симуляцию
        run: |
          go run ./cmd/aquarium -steps 20000 -seed 1 -csv full.csv
          # Каждый 20-й шаг: для графика хватит, а файл в 20 раз меньше.
          awk -F, 'NR == 1 || $2 % 20 == 0' full.csv > site/data.csv
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
