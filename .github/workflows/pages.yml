name: Pages

# Сайт обновляется с каждым релизом (коммит в main) или вручную из вкладки Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # выложить сайт
  id-token: write # подтвердить Pages, что деплой идёт из этого репозитория

# Два деплоя одновременно не запускаем, но и начатый не обрываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Собрать симуляцию в WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o site/aquarium.wasm ./cmd/web
          # Загрузчик wasm идёт вместе с Go и должен быть той же версии, что и компилятор.
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
