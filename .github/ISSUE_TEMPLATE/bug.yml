name: Баг
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: Команда запуска с флагами. Если есть seed — укажите его, симуляция детерминирована.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или коммит
      placeholder: v0.1.0
