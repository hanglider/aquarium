name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # создать релиз и загрузить файлы

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go test
        run: go test ./...

      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="aquarium-${GITHUB_REF_NAME}-${os}-${arch}"
            [ "$os" = windows ] && name="$name.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$name" ./cmd/aquarium
          done
          cd dist && sha256sum * > checksums.txt

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
