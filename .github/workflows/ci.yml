name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

      # cmd/web собирается только под js/wasm, обычный go build его пропускает.
      - name: go build (WebAssembly для сайта)
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/web
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/web

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Актуальный Go, а не минимальный из go.mod: проверяем то,
      # чем реально собираются бинарники.
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
